apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: distributed-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: distributedcache-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: cache-config
                  key: SPRING_DATA_MONGODB_URI
          readinessProbe:
            httpGet:
              path: /api/v1/cache/cluster-status
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/cache/cluster-status
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10